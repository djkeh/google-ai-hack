<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musico — Interactive Stage</title>
  <style>
    :root {
      --bg: #07070f;
      --bg-card: #0f101d;
      --bg-card-alt: #16182c;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(168, 85, 247, 0.5);
      --text: #f8fafc;
      --muted: #94a3b8;
      --purple: #a855f7;
      --cyan: #00f5d4;
      --gold: #facc15;
      --green: #22c55e;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── 상단 내비게이션 바 ── */
    header {
      background: rgba(11, 12, 24, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 19px;
      color: #070710;
      box-shadow: 0 0 20px rgba(0, 245, 212, 0.3);
    }
    .brand-title h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-subtitle {
      font-size: 12px;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* 버튼 스타일 */
    .btn {
      background: var(--bg-card-alt);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .btn:hover {
      border-color: var(--purple);
      background: rgba(168, 85, 247, 0.16);
      transform: translateY(-1px);
    }
    .btn.active {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.35), rgba(0, 245, 212, 0.2));
      border-color: var(--cyan);
      color: #fff;
      box-shadow: 0 0 14px rgba(0, 245, 212, 0.25);
    }
    .btn-primary {
      background: linear-gradient(135deg, #9333ea, #6366f1);
      border-color: #a855f7;
      color: #fff;
      box-shadow: 0 0 16px rgba(147, 51, 234, 0.3);
    }
    .btn-primary:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
    }
    .btn-secondary:hover {
      color: var(--text);
      border-color: rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.05);
    }

    .pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
      background: rgba(168, 85, 247, 0.16);
      color: #d8b4fe;
      border: 1px solid rgba(168, 85, 247, 0.35);
    }
    .pill-cyan {
      background: rgba(0, 245, 212, 0.12);
      color: var(--cyan);
      border-color: rgba(0, 245, 212, 0.3);
    }

    /* ── 메인 컨테이너 ── */
    .stage-container {
      max-width: 1360px;
      margin: 0 auto;
      padding: 20px 24px 60px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ── 1. 메인 스테이지 카드 ── */
    .stage-card {
      background: #080914;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .stage-card-header {
      padding: 12px 20px;
      background: rgba(16, 17, 32, 0.85);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stage-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
    }
    .player-frame-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #040408;
      position: relative;
    }
    #scene-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* 스테이지 하단 퀵 내비게이션 바 */
    .seek-hotspots {
      padding: 12px 20px;
      background: rgba(14, 15, 28, 0.95);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hotspots-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .hotspot-btn {
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      border: 1px solid var(--border);
      padding: 6px 13px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .hotspot-btn:hover {
      border-color: var(--cyan);
      color: #fff;
      background: rgba(0, 245, 212, 0.12);
    }
    .hotspot-btn.climax {
      border-color: rgba(250, 204, 21, 0.4);
      color: var(--gold);
      background: rgba(250, 204, 21, 0.08);
    }
    .hotspot-btn.climax:hover {
      background: rgba(250, 204, 21, 0.2);
    }
    .seek-readout {
      font-family: "SF Mono", Menlo, monospace;
      font-size: 12px;
      color: var(--cyan);
    }

    /* ── 2. 연출 커스텀 입력창 ── */
    .director-bar {
      display: flex;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .director-input {
      flex: 1;
      background: #080914;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      transition: border-color 0.15s ease;
    }
    .director-input:focus {
      outline: none;
      border-color: var(--purple);
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.25);
    }

    /* ── 3. 음악 흐름 & 안무 타임라인 ── */
    .song-overview-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
    }
    .card-header-simple {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }
    .card-title-simple {
      font-size: 14px;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sections-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    @media (max-width: 768px) {
      .sections-strip { grid-template-columns: repeat(2, 1fr); }
    }
    .sec-block {
      background: var(--bg-card-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .sec-block:hover {
      border-color: var(--cyan);
      transform: translateY(-1px);
    }
    .sec-block.climax {
      border-color: rgba(250, 204, 21, 0.5);
      background: rgba(250, 204, 21, 0.08);
    }
    .sec-time {
      font-family: "SF Mono", Menlo, monospace;
      font-size: 11px;
      color: var(--cyan);
    }
    .sec-name {
      font-size: 13px;
      font-weight: 700;
      margin: 3px 0;
    }
    .sec-mood {
      font-size: 11px;
      color: var(--muted);
    }

    #energy-canvas {
      width: 100%;
      height: 76px;
      background: #080914;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
      cursor: pointer;
      display: block;
    }

    /* 안무 상세 리스트 */
    .cue-accordion {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #090a16;
    }
    .cue-accordion-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.02);
      user-select: none;
    }
    .cue-accordion-header:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .cue-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 280px;
      overflow-y: auto;
      padding: 10px;
    }
    .cue-item {
      background: var(--bg-card-alt);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 9px 12px;
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 12px;
      align-items: center;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .cue-item:hover {
      border-color: var(--purple);
      background: rgba(168, 85, 247, 0.14);
    }
    .cue-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .cue-time {
      font-family: "SF Mono", Menlo, monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--gold);
    }
    .cue-why {
      font-size: 12px;
      color: #f1f5f9;
    }
    .cue-trigger {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── 토스트 메시지 ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #181932;
      border: 1px solid var(--purple);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      display: none;
      z-index: 100;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 상단 내비게이션 바 -->
  <header>
    <div class="brand" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
      <div class="brand-logo">M</div>
      <div class="brand-title">
        <h1>MUSICO</h1>
        <div class="brand-subtitle">인터랙티브 모션 그래픽 스테이지</div>
      </div>
    </div>

    <!-- 곡 선택 -->
    <div class="header-actions">
      <button id="demo-btn-1" class="btn active" onclick="selectJob('demo_sugar_plum_fairy')">
        🩰 Sugar Plum Fairy
      </button>
      <button id="demo-btn-2" class="btn" onclick="selectJob('demo_neon_pulse')">
        ⚡ Neon Pulse
      </button>
      <select id="job-selector" class="btn" onchange="selectJob(this.value)" style="max-width: 170px;">
        <option value="demo_sugar_plum_fairy">트랙 선택...</option>
      </select>
    </div>
  </header>

  <!-- 메인 플레이어 컨테이너 -->
  <main class="stage-container">

    <!-- 1. 메인 스테이지 (16:9 Canvas) -->
    <section class="stage-card">
      <div class="stage-card-header">
        <div class="stage-title">
          <span id="stage-title-text" style="font-size: 15px;">Dance of the Sugar Plum Fairy</span>
          <span id="score-meta-pill" class="pill">120 BPM · 32.0s</span>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <a id="open-standalone-link" href="/jobs/demo_sugar_plum_fairy/scene/index.html" target="_blank" class="btn btn-secondary" style="padding:5px 11px; font-size:12px;">
            ↗ 전체 화면으로 보기
          </a>
        </div>
      </div>

      <!-- 캔버스 인터랙티브 플레이어 프레임 -->
      <div class="player-frame-wrap">
        <iframe id="scene-iframe" src="/jobs/demo_sugar_plum_fairy/scene/index.html" allow="autoplay"></iframe>
      </div>

      <!-- 구간 바로가기 핫스팟 바 -->
      <div class="seek-hotspots">
        <div class="hotspots-group">
          <span style="font-size: 11px; font-weight: 700; color: var(--muted); margin-right: 4px;">구간 점프:</span>
          <button class="hotspot-btn" onclick="seekSceneTo(2.0)">도입부 (2.0s)</button>
          <button class="hotspot-btn" onclick="seekSceneTo(10.0)">전개부 (10.0s)</button>
          <button class="hotspot-btn climax" onclick="seekSceneToClimax()">★ 클라이맥스</button>
          <button class="hotspot-btn" onclick="seekSceneTo(29.5)">마무리 (29.5s)</button>
        </div>
        <div id="seek-status-readout" class="seek-readout">
          재생 준비 완료
        </div>
      </div>
    </section>

    <!-- 2. 연출 변경 입력창 (원클릭 재연출) -->
    <section class="director-bar">
      <span style="font-size: 18px;">✨</span>
      <input
        id="redirect-prompt-input"
        class="director-input"
        type="text"
        placeholder="무대 연출을 변경해보세요 (예: '클라이맥스에 화려한 점프와 골드 파티클 추가', '더 빠른 회전 안무로 변경')..."
        onkeydown="if(event.key === 'Enter') redirectCurrentJob()"
      />
      <button class="btn btn-primary" onclick="redirectCurrentJob()">
        무대 연출 적용
      </button>
    </section>

    <!-- 3. 음악 흐름 & 안무 타임라인 -->
    <section class="song-overview-card">
      <div class="card-header-simple">
        <div class="card-title-simple">
          <span>🎼 음악 구조 및 에너지 곡선</span>
        </div>
        <div style="font-size:12px; color:var(--muted);">
          캐릭터: <strong id="char-name-simple" style="color:var(--text);">Aurelia</strong>
        </div>
      </div>

      <!-- 4개 섹션 스트립 -->
      <div id="sections-strip" class="sections-strip"></div>

      <!-- 인터랙티브 에너지 파형 (클릭하여 해당 위치로 점프) -->
      <canvas id="energy-canvas" width="900" height="76" title="파형의 원하는 위치를 클릭하면 해당 구간으로 점프합니다"></canvas>

      <!-- 상세 안무 리스트 (접이식) -->
      <div class="cue-accordion">
        <div class="cue-accordion-header" onclick="toggleCueList()">
          <span>🎯 상세 안무 타이밍 (<span id="cue-count-text">10개 동작</span>)</span>
          <span id="cue-arrow-icon" style="font-size: 11px; color: var(--muted);">▸ 안무 목록 보기</span>
        </div>
        <div id="cue-list" class="cue-list" style="display: none;"></div>
      </div>
    </section>

  </main>

  <!-- 알림 토스트 -->
  <div id="toast" class="toast">요청을 처리하고 있습니다...</div>

  <script>
    let currentJob = null;
    let cueListOpen = false;

    function toggleCueList() {
      cueListOpen = !cueListOpen;
      const list = document.getElementById("cue-list");
      const icon = document.getElementById("cue-arrow-icon");
      list.style.display = cueListOpen ? "flex" : "none";
      icon.textContent = cueListOpen ? "▾ 안무 목록 접기" : "▸ 안무 목록 보기";
    }

    function showToast(msg, durationMs = 0) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      if (durationMs > 0) {
        setTimeout(() => { el.style.display = "none"; }, durationMs);
      }
    }

    function hideToast() {
      document.getElementById("toast").style.display = "none";
    }

    async function loadJobsList(selectedId) {
      const res = await fetch("/api/jobs");
      const data = await res.json();
      const sel = document.getElementById("job-selector");
      sel.innerHTML = "";
      (data.jobs || []).forEach(j => {
        const opt = document.createElement("option");
        opt.value = j.job_id;
        opt.textContent = `${j.title}`;
        if (j.job_id === selectedId) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    async function selectJob(jobId) {
      document.getElementById("demo-btn-1").classList.toggle("active", jobId === "demo_sugar_plum_fairy");
      document.getElementById("demo-btn-2").classList.toggle("active", jobId === "demo_neon_pulse");

      const res = await fetch(`/api/jobs/${jobId}`);
      if (!res.ok) return;
      currentJob = await res.json();
      await loadJobsList(jobId);
      renderJobToStudio(currentJob);
    }

    function renderJobToStudio(job) {
      document.getElementById("stage-title-text").textContent = job.title || "무대";
      document.getElementById("open-standalone-link").href = job.scene_url;

      const iframe = document.getElementById("scene-iframe");
      if (!iframe.src.endsWith(job.scene_url)) {
        iframe.src = job.scene_url;
      }

      const score = job.score || {};
      const events = score.events || [];
      const sections = score.sections || [];
      const char = score.character || {};

      document.getElementById("score-meta-pill").textContent =
        `${score.bpm || 120} BPM · ${score.duration || 32}s · ${events.length}개 안무`;
      document.getElementById("char-name-simple").textContent =
        char.name || "주인공";
      document.getElementById("cue-count-text").textContent =
        `${events.length}개 동작`;

      // 섹션 스트립 렌더링
      const secStrip = document.getElementById("sections-strip");
      secStrip.innerHTML = "";
      const climaxStart = (score.climax && score.climax.start) || 18.0;
      sections.forEach(sec => {
        const isClimax = Math.abs(sec.start - climaxStart) < 2.0 || sec.energy >= 0.85;
        const div = document.createElement("div");
        div.className = "sec-block" + (isClimax ? " climax" : "");
        div.onclick = () => seekSceneTo(sec.start + 0.15);
        div.innerHTML = `
          <div class="sec-time">${sec.start.toFixed(1)}s – ${sec.end.toFixed(1)}s ${isClimax ? "★ 클라이맥스" : ""}</div>
          <div class="sec-name">${sec.name}</div>
          <div class="sec-mood">${sec.mood} · ${(sec.energy * 100).toFixed(0)}%</div>
        `;
        secStrip.appendChild(div);
      });

      // 에너지 곡선 캔버스 그리기
      drawEnergyTimeline(job);

      // 안무 목록 렌더링
      const cueList = document.getElementById("cue-list");
      cueList.innerHTML = "";
      events.forEach(ev => {
        const item = document.createElement("div");
        item.className = "cue-item";
        item.onclick = () => seekSceneTo(ev.t + 0.12);
        item.innerHTML = `
          <div class="cue-meta">
            <span class="cue-time">⏱ ${ev.t.toFixed(2)}s · ${ev.action.toUpperCase()}</span>
          </div>
          <div>
            <div class="cue-why">${ev.why}</div>
            <div class="cue-trigger">강도: ${(ev.intensity * 100).toFixed(0)}%</div>
          </div>
        `;
        cueList.appendChild(item);
      });
    }

    function drawEnergyTimeline(job) {
      const canvas = document.getElementById("energy-canvas");
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      const score = job.score || {};
      const dur = Number(score.duration || 32.0);
      const curve = (job.features_summary && job.features_summary.rms_curve) || [];
      const climax = score.climax || { start: 18, end: 27 };

      // 클라이맥스 구간 강조
      const cx1 = (climax.start / dur) * W;
      const cx2 = (climax.end / dur) * W;
      ctx.fillStyle = "rgba(250, 204, 21, 0.12)";
      ctx.fillRect(cx1, 0, cx2 - cx1, H);

      // 에너지 파형
      if (curve.length > 1) {
        ctx.beginPath();
        ctx.moveTo(0, H);
        curve.forEach(pt => {
          const x = (pt.t / dur) * W;
          const y = H - 8 - pt.value * (H - 20);
          ctx.lineTo(x, y);
        });
        ctx.lineTo(W, H);
        ctx.closePath();
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, "rgba(168, 85, 247, 0.5)");
        grad.addColorStop(1, "rgba(0, 245, 212, 0.05)");
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.beginPath();
        curve.forEach((pt, idx) => {
          const x = (pt.t / dur) * W;
          const y = H - 8 - pt.value * (H - 20);
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = "#00f5d4";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // 안무 포인트 마커
      (score.events || []).forEach(ev => {
        const x = (ev.t / dur) * W;
        ctx.strokeStyle = "#facc15";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x, 4);
        ctx.lineTo(x, H - 4);
        ctx.stroke();

        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.arc(x, 10, 3.5, 0, Math.PI * 2);
        ctx.fill();
      });

      canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        const targetT = Math.max(0, Math.min(dur, ratio * dur));
        seekSceneTo(targetT);
      };
    }

    function seekSceneTo(tSec) {
      const iframe = document.getElementById("scene-iframe");
      if (iframe && iframe.contentWindow) {
        if (typeof iframe.contentWindow.__seek === "function") {
          const snap = iframe.contentWindow.__seek(tSec);
          document.getElementById("seek-status-readout").textContent =
            `⏱ ${tSec.toFixed(2)}초 위치로 이동`;
        } else {
          iframe.contentWindow.postMessage({ type: "MUSICO_SEEK", t: tSec }, "*");
          document.getElementById("seek-status-readout").textContent =
            `⏱ ${tSec.toFixed(2)}초 위치로 이동`;
        }
      }
    }

    function seekSceneToClimax() {
      if (!currentJob || !currentJob.score || !currentJob.score.climax) {
        seekSceneTo(18.15);
        return;
      }
      seekSceneTo(currentJob.score.climax.start + 0.15);
    }

    async function redirectCurrentJob() {
      if (!currentJob) return;
      const promptInput = document.getElementById("redirect-prompt-input");
      const prompt = promptInput.value.trim() || "무대에 화려한 점프와 파티클 효과를 추가해줘.";
      showToast(`무대 연출을 적용하고 있습니다...`);
      try {
        const res = await fetch(`/api/jobs/${currentJob.job_id}/redirect`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });
        const newJob = await res.json();
        currentJob = newJob;
        await loadJobsList(newJob.job_id);
        renderJobToStudio(newJob);
        promptInput.value = "";
        showToast(`새로운 무대 연출이 준비되었습니다!`, 4000);
      } catch (e) {
        showToast(`연출 적용 중 오류가 발생했습니다: ${e}`, 4000);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      selectJob("demo_sugar_plum_fairy");
    });
  </script>
</body>
</html>
